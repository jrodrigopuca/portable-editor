name: Reporte de bug
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Versión de portable-editor
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Sistema operativo y versión
      placeholder: "macOS 15.2 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir el archivo X
        2. Hacer Y
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
      description: Si hay mensaje de error, pegalo completo.
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Archivo involucrado (si aplica)
      description: Tipo de archivo, tamaño aproximado y encoding si lo sabés.
