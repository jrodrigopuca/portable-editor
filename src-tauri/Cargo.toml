[package]
name = "portable-editor"
version = "0.1.0"
description = "Editor de texto minimalista para devs (Linux/macOS)"
authors = ["juan"]
edition = "2021"

[lib]
name = "portable_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
