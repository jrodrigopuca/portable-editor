<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>portable-editor icon</title>
  <!-- Source icon for portable-editor. Rasterize to 1024x1024 PNG and run
       `npm run tauri icon assets/icon-1024.png` to regenerate all formats. -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="#282c34"/>
  <!-- code lines, One Dark palette -->
  <rect x="224" y="264" width="240" height="76" rx="38" fill="#e06c75"/>
  <rect x="512" y="264" width="288" height="76" rx="38" fill="#61afef"/>
  <rect x="304" y="412" width="384" height="76" rx="38" fill="#98c379"/>
  <rect x="304" y="560" width="176" height="76" rx="38" fill="#c678dd"/>
  <rect x="528" y="560" width="200" height="76" rx="38" fill="#56b6c2"/>
  <!-- block cursor on the empty line -->
  <rect x="224" y="700" width="104" height="88" rx="14" fill="#e5c07b"/>
</svg>
